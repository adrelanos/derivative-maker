name: Stage reviewed DhampirOS alpha

on:
  push:
    branches: ['codex/downloadable-images']
    paths: ['release-reviews/v0.1.0-alpha.1.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhampiros-alpha-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'potemkin666/DhampirOS' && github.actor == 'potemkin666'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate reviewed evidence and stage the experimental files
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/publish-image-release.py
      - name: Return the small catalogue proposal for public URL verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dhampiros-published-catalogue
          path: prepared-release/catalogue-proposal.json
          if-no-files-found: error
          retention-days: 14
